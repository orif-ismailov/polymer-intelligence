# Polymer Intelligence — Production stack (D-05.1)
# ============================================================================
# Usage:
#   docker compose -f deploy/docker-compose.yml up -d
#
# Prerequisites (production):
#   - Create a real .env ONE LEVEL ABOVE the repo root (../.env) from
#     deploy/.env.example and fill in EVERY [SECRET] marker. The .env is NEVER
#     committed (.gitignore). This compose holds NO secret literals — every
#     secret is interpolated from .env via ${VAR} with no inline default, so a
#     missing/empty secret fails fast at the app layer (pydantic Settings)
#     instead of silently running with a weak default (WR-05).
#   - Obtain TLS certs via certbot into the letsencrypt volume (see
#     docs/deployment-guide.md). nginx mounts the TLS prod config nginx.conf.
#
# Container set (DEC-deploy-single-vps):
#   api, worker, beat, userbot, dashboard, postgres, redis, minio, nginx
#   - userbot is a SEPARATE long-lived process (DEC-userbot-separate-process)
#   - the aiogram webhook is served by the api service (NO separate bot container)
#   - nginx is the ONLY externally-exposed service (80/443); everything else is
#     reachable only on the internal docker network (least privilege — T-06-10)
#
# Production deltas vs. docker-compose.dev.yml:
#   - NO source bind-mounts (no live-reload; images are immutable in prod)
#   - api command drops --reload
#   - APP_ENV=production on api (gates the Secure refresh-cookie flag)
#   - dashboard service added (Next.js standalone, deploy/Dockerfile.dashboard)
#   - ONLY nginx publishes host ports (80, 443)
#   - nginx mounts nginx.conf (TLS) + letsencrypt/certbot/webapp volumes
#   - NO weak inline secret defaults (BOT_TOKEN/WEBHOOK_SECRET/TG_API_*/
#     TG_SESSION_STRING/POSTGRES_PASSWORD/S3 creds are required at runtime)
# ============================================================================

services:

  # ── PostgreSQL 16 ──────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file:
      - path: ../.env
        required: false   # static `config` validation runs without a real .env;
                          # the deployment guide REQUIRES a real .env at `up` time.
    environment:
      POSTGRES_DB: polymer_intelligence
      POSTGRES_USER: pi_user
      # No weak default — POSTGRES_PASSWORD must come from .env (WR-05 / T-06-09).
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # No host ports — postgres is internal-only (T-06-10).
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pi_user -d polymer_intelligence"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis ──────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    # No host ports — redis is internal-only (T-06-10).
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── MinIO (S3-compatible object storage for request file uploads) ─────────
  # Keep MinIO for self-hosted S3 file storage. To use an external/managed S3
  # instead: drop this service and point S3_ENDPOINT/S3_ACCESS_KEY/S3_SECRET_KEY
  # at the external provider via .env (the api/worker only need S3_* env vars).
  minio:
    # Pinned (not :latest): recent MinIO images require the x86-64-v2 CPU level and
    # crash with "Fatal glibc error: CPU does not support x86-64-v2" on older CPUs.
    # This RELEASE runs on baseline x86-64 (it's the version already proven on this
    # host). Override via .env (MINIO_IMAGE=...) if your CPU supports a newer build.
    image: ${MINIO_IMAGE:-quay.io/minio/minio:RELEASE.2023-01-12T02-06-16Z}
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      # No weak defaults — S3 creds are required from .env (WR-05 / T-06-09).
      MINIO_ROOT_USER: ${S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY}
    volumes:
      - minio_data:/data
    # No host ports — MinIO is internal-only; reached by api/worker over the
    # docker network at http://minio:9000 (T-06-10).
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/minio/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── MinIO bucket init (one-shot) ──────────────────────────────────────────
  # Creates S3_BUCKET in MinIO before the api serves uploads. Without it a fresh
  # MinIO has no bucket and the first file upload 500s (NoSuchBucket). The MinIO
  # root creds ARE S3_ACCESS_KEY/S3_SECRET_KEY (see the minio service above), so the
  # root alias can create exactly the bucket the api/worker read/write. Idempotent
  # (mc mb --ignore-existing); exits 0, and the api waits for it to complete.
  minio-init:
    # mc client pinned to the same era as the minio server (RELEASE.2023-01-12) — NOT
    # :latest. Recent minio/mc builds require x86-64-v2 and crash on older CPUs, the
    # same reason MINIO_IMAGE is pinned. Override via .env (MC_IMAGE=...) on newer hosts.
    image: ${MC_IMAGE:-minio/mc:RELEASE.2023-01-11T03-14-16Z}
    restart: "no"
    depends_on:
      minio:
        condition: service_healthy
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_BUCKET: ${S3_BUCKET:-polymer-files}
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $${S3_ACCESS_KEY} $${S3_SECRET_KEY} &&
      mc mb --ignore-existing local/$${S3_BUCKET} &&
      echo \"minio-init: bucket $${S3_BUCKET} ready\"
      "

  # ── API (FastAPI + uvicorn; also serves the aiogram webhook) ───────────────
  api:
    # Prebuilt image pulled from GHCR (CI `build-images` job). IMAGE_TAG selects the
    # environment's tag (main / dev) and is exported by the deploy job; IMAGE_PREFIX is
    # overridable via .env. The `build:` block stays as a local/dev fallback so
    # `docker compose up --build` (make smoke, docker-compose.dev.yml) still works.
    image: ${IMAGE_PREFIX:-ghcr.io/orif-ismailov/polymer-intelligence}-backend:${IMAGE_TAG:-main}
    build:
      context: ../backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - path: ../.env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://pi_user:${POSTGRES_PASSWORD}@postgres:5432/polymer_intelligence
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT: http://minio:9000
      # /app on the path so the mounted repo-root packages (telegram, userbot) are
      # importable by the Celery worker — `celery`/console scripts don't add CWD to
      # sys.path the way uvicorn/`python -c` do (notify + userbot_health tasks).
      PYTHONPATH: /app
      # Production env — gates the Secure flag on the refresh cookie (TLS behind nginx).
      APP_ENV: production
    volumes:
      # The `telegram` (aiogram bot/webhook) package lives at the repo root, outside
      # the backend image build context (../backend), so mount it read-only. The api
      # serves the bot webhook + registers it on startup (when PUBLIC_WEBAPP_URL set).
      - ../telegram:/app/telegram:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    # Migrate + seed (reference, staff, sources) BEFORE serving — idempotent
    # pre-start steps so a fresh deploy comes up fully provisioned with no manual
    # step. NO --reload in production (immutable image, no bind-mount watcher).
    command: sh -c "python -m app.entrypoint && python -m app.seed.seed_reference && python -m app.seed.seed_staff && python -m app.seed.seed_sources && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    # No host ports — only nginx reaches the api over the docker network (T-06-10).
    # No source bind-mount — the image is the single source of truth in prod.
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/api/v1/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ── Celery Worker ─────────────────────────────────────────────────────────
  worker:
    # Same backend image as api (shared Dockerfile) — one pull serves api/worker/beat.
    image: ${IMAGE_PREFIX:-ghcr.io/orif-ismailov/polymer-intelligence}-backend:${IMAGE_TAG:-main}
    build:
      context: ../backend
      dockerfile: Dockerfile
    # REQ-nfr-reliability / T-02-25: auto-restart on crash so a single worker
    # failure never silently stops ingest.
    restart: unless-stopped
    env_file:
      - path: ../.env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://pi_user:${POSTGRES_PASSWORD}@postgres:5432/polymer_intelligence
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT: http://minio:9000
      # /app on the path so the mounted repo-root packages (telegram, userbot) are
      # importable by the Celery worker — `celery`/console scripts don't add CWD to
      # sys.path the way uvicorn/`python -c` do (notify + userbot_health tasks).
      PYTHONPATH: /app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      # `telegram` package (notify/send via the bot) is a repo-root package, not in
      # the image — mount it read-only.
      - ../telegram:/app/telegram:ro
      # `userbot` package — the check_userbot_health task (queue `ingest`, which this
      # worker consumes) lazily imports userbot.heartbeat. Repo-root package, not in
      # the image, so mount it read-only at /app/userbot (WORKDIR is /app) too.
      - ../userbot:/app/userbot:ro
    command: celery -A app.tasks.celery_app worker --loglevel=info -Q ingest,parse,notify,default,verify
    # No host ports.

  # ── Celery Beat (scheduler) ───────────────────────────────────────────────
  beat:
    # Same backend image as api/worker.
    image: ${IMAGE_PREFIX:-ghcr.io/orif-ismailov/polymer-intelligence}-backend:${IMAGE_TAG:-main}
    build:
      context: ../backend
      dockerfile: Dockerfile
    # REQ-nfr-reliability / T-02-25: auto-restart so the beat scheduler never
    # silently drops its periodic fetch/health schedule.
    restart: unless-stopped
    env_file:
      - path: ../.env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://pi_user:${POSTGRES_PASSWORD}@postgres:5432/polymer_intelligence
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      # `telegram` package may be imported when the celery app loads its task modules.
      - ../telegram:/app/telegram:ro
    command: celery -A app.tasks.celery_app beat --loglevel=info
    # No host ports.

  # ── Telegram Userbot (long-lived MTProto monitoring process) ─────────────
  # DEC-userbot-separate-process: a SEPARATE service from worker/beat. Subscribes
  # to enabled telegram_channel sources, writes new messages to raw_items via the
  # immutable save_raw_items dedupe path, and emits a Redis heartbeat every
  # USERBOT_HEARTBEAT_SECONDS. The check_userbot_health beat task monitors the
  # heartbeat and raises a deduped admin alert on silence >5 min (SC#1 / T-05-08).
  #
  # Prerequisites (customer-side handoff):
  #   1. Provide TG_API_ID and TG_API_HASH from https://my.telegram.org
  #   2. Generate TG_SESSION_STRING once via userbot/session.py (interactive)
  #   3. Add all three to .env (see deploy/.env.example [SECRET] markers)
  userbot:
    # Opt-in only (DEC): the userbot does NOT start on a plain `up`/deploy. Bring it
    # up explicitly with `--profile userbot` once a DEDICATED session string exists.
    # Off by default in BOTH prod and dev so two processes can never share one
    # TG_SESSION_STRING — that triggers AuthKeyDuplicated and permanently kills the
    # session. Re-enable: `docker compose … --profile userbot up -d userbot`.
    profiles: ["userbot"]
    # Same backend image as api/worker/beat.
    image: ${IMAGE_PREFIX:-ghcr.io/orif-ismailov/polymer-intelligence}-backend:${IMAGE_TAG:-main}
    build:
      context: ../backend
      dockerfile: Dockerfile
    # Long-lived process — restart on any crash so monitoring is not silently lost.
    restart: unless-stopped
    env_file:
      - path: ../.env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://pi_user:${POSTGRES_PASSWORD}@postgres:5432/polymer_intelligence
      REDIS_URL: redis://redis:6379/0
      # Telegram userbot credentials — required from .env, NO weak default so a
      # misconfigured deploy fails fast instead of starting unauthenticated
      # (WR-05 / T-06-09). Empty here → the userbot's own config validation rejects.
      TG_API_ID: ${TG_API_ID}
      TG_API_HASH: ${TG_API_HASH}
      TG_SESSION_STRING: ${TG_SESSION_STRING}
      # Tuning (optional overrides; config.py defaults apply if absent).
      USERBOT_CHANNEL_REREAD_SECONDS: ${USERBOT_CHANNEL_REREAD_SECONDS:-600}
      USERBOT_HEARTBEAT_SECONDS: ${USERBOT_HEARTBEAT_SECONDS:-60}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      # The userbot package lives at the repo root, OUTSIDE the backend image's
      # build context (../backend), so it is NOT baked into the image. Mount it
      # read-only at /app/userbot (WORKDIR is /app). The app.* modules it imports
      # ARE in the image.
      - ../userbot:/app/userbot:ro
      # app.* may transitively import the repo-root `telegram` package too.
      - ../telegram:/app/telegram:ro
    command: python -m userbot.main
    # No host ports.

  # ── Dashboard (Next.js standalone) ─────────────────────────────────────────
  # Built from deploy/Dockerfile.dashboard (next.config: output: "standalone").
  # Listens on :3000 internally; nginx proxies /dashboard/ → http://dashboard:3000/.
  dashboard:
    image: ${IMAGE_PREFIX:-ghcr.io/orif-ismailov/polymer-intelligence}-dashboard:${IMAGE_TAG:-main}
    build:
      context: ../dashboard
      dockerfile: ../deploy/Dockerfile.dashboard
    restart: unless-stopped
    env_file:
      - path: ../.env
        required: false
    # No host ports — only nginx reaches the dashboard over the docker network
    # (T-06-10). The container's internal port stays 3000.
    depends_on:
      - api

  # ── nginx reverse proxy (behind the host's shared TLS front-door) ──────────
  # The host nginx owns 80/443 + the public certs and forwards plain HTTP here by
  # Host header. This inner nginx routes those Hosts to the right upstream, split
  # across three vhosts — admin.ai-imex.com (dashboard), api.ai-imex.com (api),
  # ai-imex.com (static Web App) — each also proxying /api → api:8000 (T-06-11).
  nginx:
    image: nginx:stable
    restart: unless-stopped
    # HTTP only, bound to localhost — the host front-door forwards to :8080.
    # The host vhosts (admin./api./ai-imex.com) proxy_pass http://127.0.0.1:8080
    # with the Host header preserved. Change the host port if 8080 is taken.
    #
    # INNER_NGINX_PORT / INNER_NGINX_CONF default to the prod values, so a plain
    # prod `up` is unchanged. A SECOND isolated stack (the dev-server environment)
    # overrides them via its own .env: INNER_NGINX_PORT=8081 +
    # INNER_NGINX_CONF=nginx.dev-server.behind-proxy.conf. See
    # docs/runbook-dev-environment.md.
    ports:
      - "127.0.0.1:${INNER_NGINX_PORT:-8080}:80"
    volumes:
      # Host-aware HTTP-only config (routes by the forwarded Host header).
      - ./nginx/${INNER_NGINX_CONF:-nginx.behind-proxy.conf}:/etc/nginx/nginx.conf:ro
      # Built static Telegram Web App served directly by nginx at the root of
      # ai-imex.com. Populate it with `make webapp-bundle`. See deployment-guide §4a.
      - webapp_static:/var/www/webapp:ro
      # Built client portal (Vite) served at the root of cabinet.ai-imex.com.
      # Populate it with `make portal-bundle`.
      - portal_static:/var/www/portal:ro
    depends_on:
      - api
      - dashboard

  # ── Web App bundle builder (one-shot; profile-gated, never runs on `up`) ──────
  # Builds the Telegram Web App (Vite) and loads the static bundle into the shared
  # webapp_static volume that nginx serves at the root of ai-imex.com. Run at deploy time and on
  # every webapp change:
  #   docker compose -f deploy/docker-compose.yml --profile build run --rm --build webapp-build
  #   (or: make webapp-bundle)
  # Using a compose service means the project-prefixed webapp_static volume is
  # resolved automatically — no need to guess the COMPOSE_PROJECT_NAME prefix.
  webapp-build:
    profiles: ["build"]
    image: ${IMAGE_PREFIX:-ghcr.io/orif-ismailov/polymer-intelligence}-webapp:${IMAGE_TAG:-main}
    build:
      context: ../webapp
      dockerfile: ../deploy/Dockerfile.webapp
    volumes:
      - webapp_static:/out
    # Replace the bundle atomically-ish: clear, then copy the freshly built dist.
    command: sh -c "rm -rf /out/* && cp -a /dist/. /out/ && echo '[webapp-build] bundle loaded into webapp_static'"

  # ── Portal bundle builder (one-shot; profile-gated, never runs on `up`) ───────
  # Builds the client portal (Vite) and loads the static bundle into portal_static,
  # which nginx serves at the root of cabinet.ai-imex.com. Run at deploy time and on
  # every portal change:
  #   docker compose -f deploy/docker-compose.yml --profile build run --rm --build portal-build
  #   (or: make portal-bundle)
  portal-build:
    profiles: ["build"]
    image: ${IMAGE_PREFIX:-ghcr.io/orif-ismailov/polymer-intelligence}-portal:${IMAGE_TAG:-main}
    build:
      context: ../portal
      dockerfile: ../deploy/Dockerfile.portal
    volumes:
      - portal_static:/out
    command: sh -c "rm -rf /out/* && cp -a /dist/. /out/ && echo '[portal-build] bundle loaded into portal_static'"

volumes:
  postgres_data:
  redis_data:
  minio_data:
  letsencrypt:
  certbot_www:
  webapp_static:
  portal_static:
