<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#070907" />
    <meta name="robots" content="noindex" />
    <title>IMEX AI — нет соединения</title>
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <!-- Self-contained on purpose: the service worker serves this when the network
         is gone, so it may not depend on anything that would need the network. -->
    <style>
      html { background: #070907; color: #e6ede8; color-scheme: dark;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
      body { margin: 0; min-height: 100dvh; display: grid; place-items: center; padding: 24px; box-sizing: border-box; }
      main { max-width: 26rem; text-align: center; }
      img { width: 96px; height: 96px; border-radius: 22px; }
      h1 { font-size: 1.25rem; margin: 20px 0 8px; }
      p { margin: 0 0 6px; color: #9aa79f; line-height: 1.5; }
      button { margin-top: 20px; padding: 12px 22px; border: 0; border-radius: 10px;
        background: #22c55e; color: #052e10; font: inherit; font-weight: 600; cursor: pointer; }
    </style>
  </head>
  <body>
    <main>
      <img src="/icon-192.png" alt="IMEX AI" />
      <h1>Нет подключения к интернету</h1>
      <p>Проверьте соединение и попробуйте снова.</p>
      <p lang="en">You are offline. Check your connection and try again.</p>
      <button type="button" onclick="location.reload()">Повторить · Retry</button>
    </main>
  </body>
</html>
