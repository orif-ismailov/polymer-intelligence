<!doctype html>
<html lang="ru" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- Mirrors --bg of the default (dark) theme in src/app/styles.css. -->
    <meta name="theme-color" content="#070907" />
    <meta property="og:site_name" content="IMEX AI" />
    <!--
      Critical paint colours, inline so they apply before any stylesheet resolves.
      The SSR body arrives ahead of the CSS, and without this the first paint is
      the UA's white — a full-page white flash on a dark product, on every reload.
      Same duplication (and same reason) as the theme-color meta above: these two
      values mirror --bg in src/app/styles.css and must be changed with it.
    -->
    <style>
      html {
        background: #070907;
        color-scheme: dark;
      }
      html[data-theme="light"] {
        background: #f5f8f6;
        color-scheme: light;
      }
      body {
        margin: 0;
      }
    </style>
    <!-- server.js replaces the whole ssr-head block; see its applyTemplate(). -->
    <!--ssr-head-->
    <title>IMEX AI</title>
    <meta
      name="description"
      content="IMEX AI: маркетплейс нефтехимического сырья. Проверенные производители, трейдеры, логистика и лаборатории."
    />
    <!--/ssr-head-->
  </head>
  <body>
    <div id="root"><!--ssr-outlet--></div>
    <!--ssr-state-->
    <!--
      Resolve the stored theme before first paint so a `light` preference never
      flashes the dark default. Mirrors shared/lib/theme.ts — the key here must
      stay in sync with THEME_KEY in shared/config.
    -->
    <script>
      (function () {
        try {
          var mode = localStorage.getItem("portal.theme") || "dark";
          var resolved =
            mode === "system"
              ? window.matchMedia("(prefers-color-scheme: light)").matches
                ? "light"
                : "dark"
              : mode === "light"
                ? "light"
                : "dark";
          document.documentElement.setAttribute("data-theme", resolved);
        } catch (e) {
          /* keep the markup default */
        }
      })();
    </script>
    <script type="module" src="/src/entry-client.tsx"></script>
  </body>
</html>
