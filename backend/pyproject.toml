[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "polymer-intelligence-backend"
version = "0.1.0"
description = "Polymer Intelligence backend — FastAPI + Celery + SQLAlchemy 2"
requires-python = ">=3.12"
dependencies = [
    # Web framework
    # 06-01 (D-07): bound fastapi/starlette to the line the app was developed and verified
    # against (FastAPI 0.137 / Starlette 1.3 — full backend suite green). uv.lock pins the
    # exact versions; these ceilings stop a fresh resolve from pulling an unverified major.
    # Route registration is version-sensitive (see test_prices_path_mounted /
    # test_sources_router_mounted) — do not raise without re-running the full backend suite.
    "fastapi>=0.137,<0.138",
    "starlette>=1.3,<1.4",
    "uvicorn[standard]>=0.30.0",
    # Database
    "sqlalchemy>=2.0.0",
    "alembic>=1.13.0",
    "psycopg[binary]>=3.1.0",
    # Configuration
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    # Task queue
    "celery>=5.4.0",
    "redis>=5.0.0",
    # HTTP client
    "httpx>=0.27.0",
    # HTML parsing (UZEX server-rendered table extraction; selectolax verified on pypi.org — T-02-SC)
    "selectolax>=0.3.21",
    # Logging
    "structlog>=24.1.0",
    # Error tracking. SENTRY_DSN has been in the env contract since Phase 1 but was
    # never wired to anything, so production had no error reporting at all — an
    # unhandled 500 left a JSON log line and nothing tying it to a user or request.
    # The [fastapi,celery] extras pull in the ASGI + task integrations so a failure
    # inside a Celery task is attributed rather than lost.
    # pypi.org/project/sentry-sdk (Sentry official SDK)
    "sentry-sdk[fastapi,celery]>=2.0,<3.0",
    # Security
    "argon2-cffi>=23.1.0",
    "python-jose[cryptography]>=3.3.0",
    # App-layer PII encryption (Fernet) for company bank accounts (R1) / PINFL (R3).
    # Already transitively present via python-jose[cryptography]; pinned explicitly
    # because app/core/crypto.py imports it directly. pypi.org/project/cryptography
    "cryptography>=42.0.0",
    # Timezone
    "tzdata>=2024.1",
    # Telegram bot (aiogram 3 via FastAPI webhook — DEC-bot-webhook-no-separate-container)
    "aiogram>=3.13.0",
    # S3/MinIO file storage (boto3 AWS SDK; pypi.org/project/boto3 — T-03-SC approved)
    "boto3>=1.34.0",
    # FastAPI multipart file upload parsing (pypi.org/project/python-multipart — T-03-SC approved)
    "python-multipart>=0.0.9",
    # XML entity-safe parser — defends against billion-laughs XML bombs in RSS/Atom feeds (WR-03)
    # pypi.org/project/defusedxml — T-04-SC approved
    "defusedxml>=0.7.1",
    # AI extraction dependencies (Phase 5) — all three packages verified canonical on PyPI
    # and approved by the user before installation (T-05-SC package-legitimacy gate).
    # anthropic: pypi.org/project/anthropic (Anthropic official SDK)
    "anthropic>=0.40,<1.0",
    # instructor: pypi.org/project/instructor (jxnl-instructor-ai structured outputs)
    "instructor>=1.5,<2.0",
    # openai: pypi.org/project/openai (OpenAI official SDK) — the second LLM
    # provider, selected per model from /admin/settings/ai. It arrived as an
    # instructor dependency and was used without being declared; an undeclared
    # import is one `uv sync` away from vanishing.
    "openai>=1.60,<3.0",
    # telethon: pypi.org/project/telethon (LonamiWebs MTProto userbot client)
    "telethon>=1.36,<2.0",
    "weasyprint>=69.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    # Pinned to known-good versions for a reproducible CI lint/type gate (UAT Gap 2 / SC#5).
    # Do not upgrade without verifying ruff check . and mypy gates stay green.
    "ruff==0.15.17",
    "mypy==2.1.0",
    "types-redis==4.6.0.20241004",
    # S3 mock for storage tests (pypi.org/project/moto — T-03-SC approved)
    "moto>=5.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*", "parsing*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# "S" is flake8-bandit. It was NOT selected before, which made the dozen
# `# noqa: S608` comments scattered through the codebase dead suppressions for a
# rule that never ran — the codebase read as if SQL-injection linting was active
# when no security lint existed at all. "ASYNC" catches blocking calls inside
# async functions, the class of bug the upload handlers had.
select = ["E", "F", "I", "N", "UP", "B", "SIM", "S", "ASYNC"]
ignore = [
    "E501",
    # UP042: the domain enums are declared `(str, Enum)` to match their PostgreSQL
    # ENUMs verbatim. StrEnum would change `str(member)`/f-string output from
    # "SignalKind.NEWS" to "news", a behavioural change we deliberately avoid.
    "UP042",
    # N818: this codebase consistently names domain exceptions without the `Error`
    # suffix (InvalidInitData, BudgetExceeded). Disabled to match the established
    # convention rather than rename 50+ references across 12 files.
    "N818",
]

[tool.ruff.lint.per-file-ignores]
# Tests assert; that is what they are for. S105-S107 fire on the obviously-fake
# credentials every auth test needs. Scoped to tests/ so the same rules stay live
# in app/ where a hardcoded secret would actually mean something.
"tests/**" = ["S101", "S105", "S106", "S107"]
# The showcase seeders generate DEMO DATA — company names, photo picks, fake
# volumes. `random` is correct there and `secrets` would be a false precision;
# the real security-sensitive randomness (OTP codes, JWT jti, E-IMZO challenges)
# uses `secrets` and is NOT exempt here.
"app/seed/**" = ["S311", "S608", "S108"]
"scripts/**" = ["S101", "S311", "S608"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI requires Depends()/Query()/Cookie() in parameter defaults for its DI system.
# B008 is silenced only for the FastAPI DI markers, not as a blanket disable.
# See: https://fastapi.tiangolo.com/tutorial/dependencies/
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Cookie",
    "fastapi.Body",
    "fastapi.Path",
    "fastapi.Form",
    "fastapi.File",
    "fastapi.security.HTTPBearer",
    # require_page(...) is a dependency factory built once at import time and wrapped
    # in Depends(...) — the same immutable-call pattern as the FastAPI markers above.
    # (It replaced require_role, which went with the staff_role enum in 0042.)
    "app.api.deps.require_page",
    "app.api.deps.require_page_sse",
]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true

[[tool.mypy.overrides]]
# celery and kombu have no py.typed marker; ignore missing stubs for these packages.
module = ["celery", "celery.*", "kombu", "kombu.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# python-jose does not ship a py.typed marker or bundled stubs.
# types-python-jose is available but not pinned; suppress here to keep CI green.
module = ["jose", "jose.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["app.services.*"]
disallow_untyped_defs = true
disallow_any_explicit = true

[[tool.mypy.overrides]]
# Domain modules carry the app.services.* bar with them as each bounded context moves
# into app/domains/<name>/ (backend domain reorg). Global [tool.mypy] strict already
# implies disallow_untyped_defs, but `disallow_any_explicit` is NOT part of strict —
# without this block a service file would silently lose the explicit-Any ban simply by
# changing directory. The schema carve-out below must stay AFTER this block: mypy
# applies the last matching override.
module = ["app.domains.*"]
disallow_untyped_defs = true
disallow_any_explicit = true

[[tool.mypy.overrides]]
# The CI mypy gate targets app/services + app/schemas only (dev-spec §7); parsing/ is
# not directly type-checked. When an app/services module transitively imports a parsing
# helper (e.g. request_analysis_service -> parsing.budget), the parsing file's own
# (ungated) type issues must not fail the services gate. parsing keeps its own quality
# bar; this carve-out just stops transitive imports from leaking it in.
module = ["parsing.*"]
ignore_errors = true

[[tool.mypy.overrides]]
# pydantic BaseModel carries `Any` in its class body via __pydantic_parent_namespace__
# and other class-vars; disallow_any_explicit would flag our schemas for pydantic's
# internal stubs (false positive). Only disallow_untyped_defs is enforced here.
module = ["app.schemas.*"]
disallow_untyped_defs = true
disallow_any_explicit = false

[[tool.mypy.overrides]]
# Same pydantic carve-out as app.schemas.* above, for schema modules that have moved
# into a domain folder. Must come AFTER the app.domains.* block — mypy applies the
# last matching override, so this is what relaxes explicit-Any back off for schemas.
# The second entry is listed by name because mypy's module patterns wildcard whole
# components: `app.domains.*.schemas` does not match `...portal_market_schemas`.
module = [
    "app.domains.*.schemas",
    "app.domains.marketplace.portal_market_schemas",
    "app.domains.contracts.eimzo_schemas",
    "app.domains.compliance.substance_schemas",
    "app.domains.compliance.substance_match_schemas",
    "app.domains.requests.webapp_schemas",
    "app.domains.requests.analysis_schemas",
]
disallow_untyped_defs = true
disallow_any_explicit = false

[[tool.mypy.overrides]]
# ORM models, same placement rule as the schemas block above. A JSONB column is typed
# `Mapped[dict[str, Any]]` — that is the shape SQLAlchemy gives you, not a lazy
# annotation. These modules sat in app/models/ under no explicit-Any ban before the
# domain reorg, and moving a file between directories must not change what the type
# checker demands of it.
module = [
    "app.domains.*.models",
    "app.domains.verification.registry_models",
    "app.domains.contracts.eimzo_models",
    "app.domains.deals.payment_models",
    "app.domains.signals.source_models",
    "app.domains.signals.counterparty_models",
]
disallow_untyped_defs = true
disallow_any_explicit = false

[[tool.mypy.overrides]]
# alerts.service (was app/services/alert_service.py) is a polymorphic JSONB predicate
# interpreter: evaluate_condition reads
# heterogeneous condition values (lists, numbers) and entity attributes that differ
# between Signal and Request (kind/ai only exist on Signal), using genuinely dynamic
# `in`/`<` operations. Forcing explicit types here would mean casts/isinstance guards
# inside security-sensitive predicate code (T-04-24) — riskier than this scoped, more
# specific carve-out. disallow_untyped_defs stays enforced; only explicit-Any is relaxed.
module = ["app.domains.alerts.service"]
disallow_untyped_defs = true
disallow_any_explicit = false

[[tool.mypy.overrides]]
# instructor does not ship a py.typed marker; ignore missing stubs.
# pypi.org/project/instructor — T-05-SC approved (package legitimacy verified).
module = ["instructor", "instructor.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# telethon does not ship a py.typed marker; ignore missing stubs.
# pypi.org/project/telethon — T-05-SC approved (package legitimacy verified).
module = ["telethon", "telethon.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# ── The burn-down list ────────────────────────────────────────────────────────
# The CI gate used to be a hand-maintained list of ~40 FILE PATHS, duplicated in
# ci.yml and both CLAUDE.md files. That list failed OPEN: a new module was
# unchecked until somebody remembered to add it in three places, and "not in the
# list" was indistinguishable from "checked and clean".
#
# It is now inverted. CI runs `mypy app`, so everything is checked, and the
# modules below are the ones that do not pass YET. A new file is gated by
# default; exempting one is an explicit edit here that a reviewer can see.
#
# Listed individually rather than as `app.tasks.*` / `app.seed.*` wildcards on
# purpose: a wildcard would also exempt the modules in those packages that
# currently pass, which is exactly the fail-open behaviour this replaces.
#
# 48 modules at the time of writing (201 errors), mostly routers, ingest
# adapters, seeders and task modules — none of which were in the old gate
# either, so this is strictly MORE coverage than before, not less. Delete
# entries as they are cleaned up; the list should only ever shrink.
module = [
    "app.api.deps",
    "app.core.feed_bus",
    "app.core.logging",
    "app.domains.alerts.api_admin",
    "app.domains.companies.api_portal",
    "app.domains.compliance.api_admin_substances",
    "app.domains.compliance.api_portal",
    "app.domains.contracts.api_admin",
    "app.domains.deals.api_admin",
    "app.domains.deals.api_admin_escrow",
    "app.domains.deals.api_webhooks",
    "app.domains.lab_orders.api_admin",
    "app.domains.laboratory.api_admin",
    "app.domains.logistics.api_admin",
    "app.domains.marketplace.api_portal_inquiries",
    "app.domains.pricing.api_admin",
    "app.domains.requests.api_admin",
    "app.domains.requests.api_portal",
    "app.domains.requests.api_webapp",
    "app.domains.requests.api_webapp_auth",
    "app.domains.signals.api_admin",
    "app.domains.signals.api_feed",
    "app.domains.signals.api_sources",
    "app.domains.storefront.api",
    "app.domains.verification.api_admin",
    "app.ingest.html_table.adapter",
    "app.ingest.llm_page.adapter",
    "app.ingest.rss.adapter",
    "app.ingest.uzex.adapters",
    "app.ingest.xarid.adapters",
    "app.main",
    "app.seed.seed_reference",
    "app.seed.seed_showcase",
    "app.seed.seed_showcase_docs",
    "app.seed.seed_showcase_intel",
    "app.seed.seed_showcase_media",
    "app.seed.seed_showcase_news",
    "app.seed.seed_showcase_photos",
    "app.seed.seed_showcase_profiles",
    "app.tasks.celery_app",
    "app.tasks.contracts",
    "app.tasks.ingest_cbu",
    "app.tasks.parse",
    "app.tasks.parse_telegram",
    "app.tasks.portal_notify",
    "app.tasks.reports",
    "app.tasks.rescore",
    "app.tasks.userbot_health",
]
ignore_errors = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# Add repo root to sys.path so tests can import the telegram/ package
# (which lives at repo root as a sibling of backend/, per dev-spec §4.1).
pythonpath = [".", ".."]
markers = [
    "performance: integration test requiring a live Postgres DB at ~1M rows; run with -m performance",
    "gate: TZ §6.1.3 acceptance gate assertions — blocks CI (recall≥80% + precision≥85%); run with -m gate",
    "refresh: regenerate frozen predictions via live LLM; local only; requires --runlive flag; never run in CI",
]
# Exclude the heavy performance suite from the default run (it seeds ~1M rows and
# needs real Postgres). Run it explicitly with `pytest -m performance` — the CLI
# marker expression overrides this default.
addopts = "-m 'not performance and not refresh'"
