# Polymer Intelligence — nginx reverse proxy (3-domain split, TLS via certbot)
#
# Splits the stack across three domains (each app on its own origin):
#   admin.ai-imex.com → dashboard:3000  (Next.js admin panel)
#   api.ai-imex.com   → api:8000        (FastAPI backend + Telegram webhook)
#   ai-imex.com (+www)→ /var/www/webapp (static Telegram Web App / IMEX AI landing)
#
# The two frontend domains ALSO proxy /api/ → api:8000 so browser calls stay
# same-origin (refresh + client_session cookies never cross an origin, no CORS).
#
# Rate-limits /api/v1/auth/login against brute-force / credential-stuffing
# (ASVS L1 V2.2.1 — T-04-06). One SAN cert covers all four names.

worker_processes auto;

# ── Worker connections ────────────────────────────────────────────────────────
# Mandatory top-level block; nginx refuses to start without it (CR-01).
events {
    worker_connections 1024;
}

http {

    # ── Rate-limit zone ──────────────────────────────────────────────────────
    # Keyed on client IP; 10m = ~160,000 IP state entries.
    # rate=10r/m: up to ~10 login attempts per minute per client IP.
    limit_req_zone $binary_remote_addr zone=auth_login:10m rate=10r/m;

    # ── Logging ──────────────────────────────────────────────────────────────
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log  warn;

    sendfile           on;
    tcp_nopush         on;
    keepalive_timeout  65;
    server_tokens      off;  # do not expose nginx version
    client_max_body_size 12m;  # request-file uploads (webapp → /api/…/files)

    # ── MIME types ───────────────────────────────────────────────────────────
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ── Gzip ─────────────────────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml application/wasm;

    # ── Shared proxy settings for the api upstream ────────────────────────────
    # nginx `include` of a reusable snippet keeps the three vhosts in sync.
    # (Defined inline per-location below rather than an external file so the
    #  config stays single-file and self-contained.)

    # ── Security headers (T-04-01, T-04-03) ──────────────────────────────────
    # Applied per-server via the map below is not possible for add_header, so
    # each 443 server re-declares them (add_header is non-additive in nginx).

    # ── TLS parameters (shared) ──────────────────────────────────────────────
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # ══════════════════════════════════════════════════════════════════════════
    # HTTP :80 — ACME challenge (certbot HTTP-01) + redirect to HTTPS
    # One block serves the challenge and redirects for all four hostnames.
    # ══════════════════════════════════════════════════════════════════════════
    server {
        listen 80;
        server_name ai-imex.com www.ai-imex.com admin.ai-imex.com api.ai-imex.com;

        # ACME challenge (certbot webroot)
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ══════════════════════════════════════════════════════════════════════════
    # api.ai-imex.com — pure FastAPI backend (+ Telegram webhook, direct API)
    # ══════════════════════════════════════════════════════════════════════════
    server {
        listen 443 ssl;
        http2 on;
        server_name api.ai-imex.com;

        ssl_certificate     /etc/letsencrypt/live/ai-imex.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/ai-imex.com/privkey.pem;

        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Content-Security-Policy "frame-ancestors 'none'" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # Auth-login rate-limit (T-04-06, ASVS L1 V2.2.1) — must precede location /.
        location = /api/v1/auth/login {
            limit_req zone=auth_login burst=5 nodelay;
            limit_req_status 429;

            proxy_pass         http://api:8000;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 30s;
        }

        # Everything on this host is the API (T-04-05: only the api container).
        location / {
            proxy_pass         http://api:8000;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 60s;
            proxy_buffering    off;  # Required for SSE (/api/v1/feed/stream)
        }
    }

    # ══════════════════════════════════════════════════════════════════════════
    # admin.ai-imex.com — Next.js dashboard + same-origin /api/ proxy
    # ══════════════════════════════════════════════════════════════════════════
    server {
        listen 443 ssl;
        http2 on;
        server_name admin.ai-imex.com;

        ssl_certificate     /etc/letsencrypt/live/ai-imex.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/ai-imex.com/privkey.pem;

        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Content-Security-Policy "frame-ancestors 'none'" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        location = /api/v1/auth/login {
            limit_req zone=auth_login burst=5 nodelay;
            limit_req_status 429;

            proxy_pass         http://api:8000;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 30s;
        }

        # Same-origin API proxy: dashboard calls its own origin's /api/v1.
        location /api/ {
            proxy_pass         http://api:8000;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 60s;
            proxy_buffering    off;  # SSE live feed
        }

        # Dashboard (Next.js standalone) at the site root. /api/ above is more
        # specific and matches first; /_next/static/* is root-absolute.
        location / {
            proxy_pass         http://dashboard:3000;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }
    }

    # ══════════════════════════════════════════════════════════════════════════
    # ai-imex.com (+ www) — static Telegram Web App at root + same-origin /api/
    # ══════════════════════════════════════════════════════════════════════════
    server {
        listen 443 ssl;
        http2 on;
        server_name ai-imex.com www.ai-imex.com;

        ssl_certificate     /etc/letsencrypt/live/ai-imex.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/ai-imex.com/privkey.pem;

        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Content-Security-Policy "frame-ancestors 'none'" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        location = /api/v1/auth/login {
            limit_req zone=auth_login burst=5 nodelay;
            limit_req_status 429;

            proxy_pass         http://api:8000;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 30s;
        }

        # Same-origin API proxy: the Web App calls its own origin's /api/v1.
        location /api/ {
            proxy_pass         http://api:8000;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 60s;
            proxy_buffering    off;
        }

        # Static Web App bundle served at the site root (Vite base "/").
        location / {
            root /var/www/webapp;
            try_files $uri $uri/ /index.html;

            # Long-term cache for hashed assets; re-declare all five security
            # headers — nginx add_header is non-additive, so a nested location
            # otherwise drops the server-level headers (CR-06 fix, T-04-03).
            location ~* \.(js|css|woff2?|png|svg|ico)$ {
                expires 1y;
                add_header Cache-Control "public, immutable";
                add_header X-Content-Type-Options "nosniff" always;
                add_header X-Frame-Options "DENY" always;
                add_header Content-Security-Policy "frame-ancestors 'none'" always;
                add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
                add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            }
        }
    }
}
