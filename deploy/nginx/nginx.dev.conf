# Polymer Intelligence — nginx dev config (HTTP-only)
# ============================================================================
# Dev-only: no TLS (no listen 443 ssl, no ssl_certificate, no letsencrypt),
# no dashboard upstream (dashboard runs separately and is not in the dev
# compose stack). Root returns a plain-text liveness message instead of
# redirecting to /dashboard/ (which would 302 to an absent upstream).
#
# Production TLS, HSTS, letsencrypt certs, and the dashboard proxy are
# in deploy/nginx/nginx.conf — kept intact for prod deployment.
# ============================================================================

worker_processes auto;

# ── Worker connections ────────────────────────────────────────────────────────
events {
    worker_connections 1024;
}

http {

    # ── Rate-limit zone ──────────────────────────────────────────────────────
    # Keyed on client IP; 10m = ~160,000 IP state entries.
    # rate=10r/m: up to ~10 login attempts per minute per client IP.
    # (T-08-03: carry rate-limit into dev so it is effective once nginx boots)
    limit_req_zone $binary_remote_addr zone=auth_login:10m rate=10r/m;

    # ── Logging ─────────────────────────────────────────────────────────────
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log  warn;

    sendfile           on;
    tcp_nopush         on;
    keepalive_timeout  65;
    server_tokens      off;  # do not expose nginx version

    # ── MIME types ──────────────────────────────────────────────────────────
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ── Gzip ────────────────────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml application/wasm;

    # ── Dev HTTP server (port 80 only — no TLS in dev) ─────────────────────
    server {
        listen 80;
        server_name _;

        # ── Security headers (T-04-01, T-04-03) ─────────────────────────────
        # Note: HSTS omitted in dev (HTTP-only; HSTS over plain HTTP is a no-op
        # and could cause issues if a prod domain is later tested on this host).
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Content-Security-Policy "frame-ancestors 'none'" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # ── Dev liveness check (root) ────────────────────────────────────────
        # In prod, root → 301 /dashboard/. In dev the dashboard is not in the
        # compose stack, so redirect would loop or 502. Return a plain-text OK
        # so `curl http://localhost/` confirms the stack is up without an error.
        location = / {
            return 200 "dev stack up\n";
            add_header Content-Type text/plain;
        }

        # ── Auth-login rate-limit (T-08-03, T-04-06, ASVS L1 V2.2.1) ────────
        # More specific location = /api/v1/auth/login must appear BEFORE
        # the general /api/ location block so nginx matches it first.
        location = /api/v1/auth/login {
            # burst=5 nodelay: allow a short burst but immediately queue/reject beyond limit
            limit_req zone=auth_login burst=5 nodelay;
            # Return HTTP 429 Too Many Requests when limit is exceeded
            limit_req_status 429;

            proxy_pass         http://api:8000;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 30s;
        }

        # ── General API proxy (T-04-05: only /api/ exposed) ─────────────────
        # ── Presigned S3 downloads (S3_PUBLIC_ENDPOINT) ───────────────────────
        # MinIO publishes no host ports, so every document link the API handed out
        # named `http://minio:9000` and no client outside the cluster could open
        # one. This is the public door; the presign client signs against this host.
        #
        # The path is the BUCKET name (S3_BUCKET) rather than a tidy `/s3/` prefix,
        # because boto3 signs the full canonical URI: a prefix would be signed in
        # and then stripped here, and the signature would no longer match. Change
        # S3_BUCKET and this location has to change with it.
        #
        # Three details are load-bearing:
        #   * `proxy_pass` with NO trailing slash — the URI must reach MinIO byte
        #     for byte as signed; a trailing slash rewrites the path and breaks it.
        #   * `Host $host` — SigV4 lists `host` in X-Amz-SignedHeaders, so MinIO
        #     recomputes the signature over the host the client sent.
        #   * no auth and no extra headers — the signature IS the authorisation.
        #     The bucket is private (minio-init sets no anonymous policy), so an
        #     unsigned request is a 403 from MinIO and a signed one expires in 600s.
        location /polymer-files/ {
            proxy_pass         http://minio:9000;
            # $http_host, NOT $host: `$host` drops the port, so a public endpoint on
            # a non-default port (http://host:8088) is forwarded as `Host: host` and
            # MinIO answers 403 SignatureDoesNotMatch — the signature covers the host
            # EXACTLY as the client sent it. Verified in a browser; `$host` was here
            # first and produced precisely that 403.
            proxy_set_header   Host $http_host;
            proxy_buffering    off;
            proxy_read_timeout 300s;
        }

        location /api/ {
            proxy_pass         http://api:8000;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 60s;
            proxy_buffering    off;  # Required for SSE (/feed/stream)
        }
    }
}
