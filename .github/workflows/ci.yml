name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "20"

jobs:
  # ── Backend: lint, type-check, and tests ──────────────────────────────────
  backend:
    name: Backend (ruff · mypy · pytest)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: polymer_intelligence_test
          POSTGRES_USER: pi_user
          POSTGRES_PASSWORD: testpassword
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pi_user -d polymer_intelligence_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.11.2"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      # 06-01 (D-07): install the exact, committed dependency graph from backend/uv.lock
      # so CI builds are byte-reproducible (uv sync --frozen fails on any lock drift).
      # Add the synced venv to PATH so the ruff/mypy/pytest steps below run from it.
      - name: Install dependencies (uv sync --frozen)
        run: |
          uv python install ${{ env.PYTHON_VERSION }}
          uv sync --frozen --extra dev
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      # WeasyPrint (R3 contract PDF render) needs Pango/Cairo/GDK-Pixbuf + fonts at
      # runtime; without them the PDF render test skips. Install so it actually runs.
      - name: Install WeasyPrint system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libpango-1.0-0 libpangocairo-1.0-0 libpangoft2-1.0-0 \
            libharfbuzz0b libgdk-pixbuf-2.0-0 libcairo2 \
            fonts-dejavu-core fonts-liberation

      # ── Lint: ruff ─────────────────────────────────────────────────────────
      - name: Lint (ruff check)
        run: ruff check .

      # ── Type-check: mypy scoped to services/ and schemas/ ──────────────────
      # Per dev-spec §7: mypy targets backend/app/services + backend/app/schemas.
      # As the domain reorg moves a bounded context into app/domains/<name>/, that
      # domain's service and schema modules are appended here so the gate follows
      # the code instead of shrinking as directories empty out.
      - name: Type-check (mypy — app/services)
        run: >
          mypy app/services
          app/domains/marketplace/service.py
          app/domains/marketplace/requests.py
          app/domains/marketplace/compliance.py
          app/domains/verification/service.py
          app/domains/verification/checks.py
          app/domains/verification/registry.py
          app/domains/companies/service.py
          app/domains/companies/directory.py
          app/domains/contracts/service.py
          app/domains/contracts/render.py
          app/domains/contracts/eimzo.py
          app/domains/deals/service.py
          app/domains/deals/escrow.py
          app/domains/deals/rfq.py
          app/domains/compliance/substances.py
          app/domains/compliance/substance_ai.py
          app/domains/compliance/licenses.py
          app/domains/logistics/service.py
          app/domains/laboratory/service.py
          app/domains/manufacturers/service.py
          app/domains/lab_orders/service.py
          app/domains/lab_orders/samples.py
          --ignore-missing-imports

      - name: Type-check (mypy — app/schemas)
        run: >
          mypy app/schemas
          app/domains/marketplace/schemas.py
          app/domains/marketplace/portal_market_schemas.py
          app/domains/verification/schemas.py
          app/domains/companies/schemas.py
          app/domains/contracts/schemas.py
          app/domains/contracts/eimzo_schemas.py
          app/domains/deals/schemas.py
          app/domains/compliance/schemas.py
          app/domains/compliance/substance_schemas.py
          app/domains/compliance/substance_match_schemas.py
          app/domains/logistics/schemas.py
          app/domains/laboratory/schemas.py
          app/domains/manufacturers/schemas.py
          app/domains/lab_orders/schemas.py
          --ignore-missing-imports

      # ── Tests ──────────────────────────────────────────────────────────────
      - name: Run pytest
        env:
          DATABASE_URL: postgresql+psycopg://pi_user:testpassword@localhost:5432/polymer_intelligence_test
          REDIS_URL: redis://localhost:6379/0
          # Required secrets: use placeholder values so Settings doesn't fail-fast
          JWT_SECRET: ci-jwt-secret-placeholder-32chars!!
          BOT_TOKEN: "123456789:AABBCCDDEEFFaabbccddeeff-placeholder"
          WEBHOOK_SECRET: ci-webhook-secret-placeholder
          TG_API_ID: "12345678"
          TG_API_HASH: ci-tg-api-hash-placeholder-32chars!
          ANTHROPIC_API_KEY: sk-ant-ci-placeholder
          S3_ACCESS_KEY: ci-s3-access-key
          S3_SECRET_KEY: ci-s3-secret-key
          S3_BUCKET: ci-bucket
          S3_ENDPOINT: http://localhost:9000
          VERIFICATION_ENC_KEY: cG9seW1lcl92ZXJpZmljYXRpb25fdGVzdF9rZXlfMzI=
        run: pytest tests/ -q --tb=short

  # ── Dashboard: eslint + tsc ────────────────────────────────────────────────
  dashboard:
    name: Dashboard (eslint · tsc)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: dashboard

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint (eslint)
        run: npx eslint --max-warnings 0

      # next-env.d.ts imports ./.next/types/routes.d.ts, generated by Next's
      # typed-routes. `.next/` is gitignored, so on a clean CI checkout the file
      # is absent and `tsc --noEmit` fails with TS2307 (SC#5). `next typegen`
      # regenerates it without a full build.
      - name: Generate Next.js route types
        run: npx next typegen

      - name: Type-check (tsc --noEmit)
        run: npx tsc --noEmit

  # ── Dashboard e2e: Playwright against a live API + seed data ────────────────
  # Brings up the FastAPI backend (migrate + seed reference/staff/demo) on :8000,
  # then runs the Playwright suite, which starts `next dev` and proxies /api there.
  dashboard-e2e:
    name: Dashboard e2e (Playwright)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: polymer_intelligence_test
          POSTGRES_USER: pi_user
          POSTGRES_PASSWORD: testpassword
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pi_user -d polymer_intelligence_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # Backend secrets — placeholders so Settings doesn't fail-fast (same as the
      # backend job). APP_ENV stays unset (non-production) so the refresh cookie is
      # not Secure-only and works over http on the runner.
      DATABASE_URL: postgresql+psycopg://pi_user:testpassword@localhost:5432/polymer_intelligence_test
      REDIS_URL: redis://localhost:6379/0
      JWT_SECRET: ci-jwt-secret-placeholder-must-be-at-least-32-chars
      BOT_TOKEN: "123456789:AABBCCDDEEFFaabbccddeeff-placeholder"
      WEBHOOK_SECRET: ci-webhook-secret-placeholder
      TG_API_ID: "12345678"
      TG_API_HASH: ci-tg-api-hash-placeholder-32chars!
      ANTHROPIC_API_KEY: sk-ant-ci-placeholder
      S3_ACCESS_KEY: ci-minio-access
      S3_SECRET_KEY: ci-minio-secret
      VERIFICATION_ENC_KEY: cG9seW1lcl92ZXJpZmljYXRpb25fdGVzdF9rZXlfMzI=
      # The dashboard's next.config rewrites /api/* to this origin.
      BACKEND_ORIGIN: http://localhost:8000
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.11.2"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Backend deps (uv sync --frozen)
        working-directory: backend
        run: |
          uv python install ${{ env.PYTHON_VERSION }}
          uv sync --frozen --extra dev

      - name: Migrate + seed (reference, staff, demo)
        working-directory: backend
        run: |
          uv run python -m app.entrypoint
          uv run python -m app.seed.seed_reference
          uv run python -m app.seed.seed_staff
          uv run python -m app.seed.seed_demo

      - name: Start API on :8000
        working-directory: backend
        run: |
          nohup uv run uvicorn app.main:app --host 0.0.0.0 --port 8000 > "$RUNNER_TEMP/uvicorn.log" 2>&1 &
          # Remember the `uv run` PID so the cleanup step can stop it. Leaving it
          # alive is what broke this job: setup-uv's post step runs
          # `uv cache prune --ci`, and uv 0.11 refuses to prune a cache that is
          # still in use (hence its `--force` "ignore in-use checks" flag), so the
          # prune exited 2 and failed the job *after* the e2e run had passed.
          echo "API_PID=$!" >> "$GITHUB_ENV"
          for i in $(seq 1 30); do
            curl -sf http://localhost:8000/api/v1/health && break
            sleep 2
          done
          curl -sf http://localhost:8000/api/v1/health || { echo "API failed to start"; cat "$RUNNER_TEMP/uvicorn.log"; exit 1; }

      - name: Set up Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Dashboard deps
        working-directory: dashboard
        run: npm ci

      - name: Install Playwright (chromium + OS deps)
        working-directory: dashboard
        run: npx playwright install --with-deps chromium

      - name: Run e2e
        working-directory: dashboard
        run: npm run e2e

      # Runs even when the e2e step fails, so the API log is available for a
      # failure that only shows up as a Playwright timeout.
      - name: Stop API
        if: ${{ always() }}
        run: |
          # Match on the command line rather than the process group: each `run:`
          # step is its own shell, so by now $API_PID's group belongs to a shell
          # that has already exited — and a recycled group id is not something to
          # send a signal to. `uv run` and the uvicorn it spawns both carry this
          # string, so one pattern reaches the whole tree.
          pkill -f "uvicorn app.main:app" 2>/dev/null || true
          # Guarded, not `kill "${API_PID:-0}"` — `kill 0` signals the whole
          # current process group, i.e. this step's own shell.
          if [ -n "${API_PID:-}" ]; then kill "$API_PID" 2>/dev/null || true; fi
          # `kill` returning is not the same as the process being gone, and the
          # prune runs moments later — wait for the port to actually close.
          for i in $(seq 1 15); do
            curl -sf http://localhost:8000/api/v1/health >/dev/null 2>&1 || break
            sleep 1
          done
          if curl -sf http://localhost:8000/api/v1/health >/dev/null 2>&1; then
            echo "::warning::API on :8000 did not stop; the uv cache prune may fail"
          fi
          echo "--- uvicorn log ---"
          cat "$RUNNER_TEMP/uvicorn.log" || true

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: dashboard/playwright-report/
          retention-days: 7

  # ── Webapp: eslint + tsc ───────────────────────────────────────────────────
  webapp:
    name: Webapp (eslint · tsc)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: webapp

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: webapp/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint (eslint)
        run: npx eslint . --ext .ts,.tsx --max-warnings 0

      - name: Type-check (tsc --noEmit)
        run: npx tsc --noEmit

  # ── Portal (client cabinet — Vite/React FSD, R1 W7) ───────────────────────────
  portal:
    name: Portal (eslint · tsc · build)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: portal

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: portal/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint (eslint)
        run: npm run lint

      - name: Type-check (tsc --noEmit)
        run: npm run typecheck

      - name: Build (vite)
        run: npm run build

  # ── Container image build + push (gated on backend + frontend passing) ─────
  # On a branch push (dev/main) this builds AND pushes the three runtime images to
  # GHCR so the server can PULL them instead of compiling on a 2-core box. On PRs it
  # still builds (validates the Dockerfiles — WR-02) but pushes nothing.
  #
  # Images (one package per component, tagged by branch + commit SHA):
  #   ghcr.io/<owner>/<repo>-backend    (backend/Dockerfile — api, worker, beat)
  #   ghcr.io/<owner>/<repo>-dashboard  (deploy/Dockerfile.dashboard)
  #   ghcr.io/<owner>/<repo>-webapp     (deploy/Dockerfile.webapp — Vite bundle)
  #   ghcr.io/<owner>/<repo>-portal     (deploy/Dockerfile.portal — SSR server)
  build-images:
    name: Build & push container images
    runs-on: ubuntu-latest
    needs: [backend, dashboard, webapp, portal]
    permissions:
      contents: read
      packages: write

    env:
      # ghcr.io/orif-ismailov/polymer-intelligence  (lowercased below for GHCR).
      IMAGE_PREFIX: ghcr.io/${{ github.repository }}
      # Push only on a real branch push; PRs (incl. forks) build without pushing.
      PUSH: ${{ github.event_name == 'push' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Compute image prefix + safe tag
        id: img
        run: |
          # GHCR requires a lowercase image path; the owner may contain uppercase.
          echo "prefix=${IMAGE_PREFIX,,}" >> "$GITHUB_OUTPUT"
          # github.ref_name is "<PR#>/merge" on pull_request events — NOT a valid Docker
          # tag (the "/" breaks the reference format). Use pr-<number> on PRs (these are
          # built as a gate, never pushed); use the branch name on a real push
          # (dev / main → exactly the tag the deploy job pulls).
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "tag=pr-${{ github.event.pull_request.number }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Log in to GHCR
        if: ${{ github.event_name == 'push' }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push backend
        # WR-02: build the SAME Dockerfile the compose stack resolves (backend/Dockerfile).
        uses: docker/build-push-action@v6
        with:
          context: backend
          file: backend/Dockerfile
          push: ${{ env.PUSH }}
          tags: |
            ${{ steps.img.outputs.prefix }}-backend:${{ steps.img.outputs.tag }}
            ${{ steps.img.outputs.prefix }}-backend:${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max

      - name: Build & push dashboard
        uses: docker/build-push-action@v6
        with:
          context: dashboard
          file: deploy/Dockerfile.dashboard
          push: ${{ env.PUSH }}
          tags: |
            ${{ steps.img.outputs.prefix }}-dashboard:${{ steps.img.outputs.tag }}
            ${{ steps.img.outputs.prefix }}-dashboard:${{ github.sha }}
          cache-from: type=gha,scope=dashboard
          cache-to: type=gha,scope=dashboard,mode=max

      - name: Build & push webapp bundle
        uses: docker/build-push-action@v6
        with:
          context: webapp
          file: deploy/Dockerfile.webapp
          push: ${{ env.PUSH }}
          tags: |
            ${{ steps.img.outputs.prefix }}-webapp:${{ steps.img.outputs.tag }}
            ${{ steps.img.outputs.prefix }}-webapp:${{ github.sha }}
          cache-from: type=gha,scope=webapp
          cache-to: type=gha,scope=webapp,mode=max

      - name: Build & push portal bundle
        # The client cabinet (cabinet.ai-imex.com). Same one-shot-bundle shape as
        # the webapp, but the image is now a RUNNABLE Node server rather than a
        # /dist carrier: compose runs it as the `portal` service. Without
        # this image the deploy job would have to compile Vite on the 2-core box.
        uses: docker/build-push-action@v6
        with:
          context: portal
          file: deploy/Dockerfile.portal
          push: ${{ env.PUSH }}
          tags: |
            ${{ steps.img.outputs.prefix }}-portal:${{ steps.img.outputs.tag }}
            ${{ steps.img.outputs.prefix }}-portal:${{ github.sha }}
          cache-from: type=gha,scope=portal
          cache-to: type=gha,scope=portal,mode=max

  # ── Deploy: only on push to main, and only after CI passes ─────────────────
  # Gated by `needs` (won't run if any listed job fails) and `if` (push-to-main
  # only — never on PRs or dev). Requires the DEPLOY_* secrets. To also gate on
  # the Playwright e2e, add `dashboard-e2e` to `needs`.
  deploy:
    name: Deploy to server
    runs-on: ubuntu-latest
    needs: [backend, dashboard, webapp, portal, build-images]
    if: ${{ github.ref == 'refs/heads/main' && github.event_name == 'push' }}
    permissions:
      contents: read
      packages: read            # pull the GHCR images published by build-images
    concurrency:
      group: deploy-main
      cancel-in-progress: false
    steps:
      - name: Pull + redeploy on the server over SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          # Ephemeral workflow token (packages: read) + the actor, forwarded to the
          # server so it can `docker login ghcr.io` and PULL the prebuilt images
          # instead of compiling them on a 2-core box. The token expires when this job
          # ends, so any leftover login on the server is inert.
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          passphrase: ${{ secrets.DEPLOY_SSH_PASSPHRASE }}   # for a passphrase-protected key
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          command_timeout: 30m
          envs: GHCR_TOKEN,GHCR_USER
          script: |
            set -eu
            # Repo path on the server. Override with the DEPLOY_PATH secret if it moves.
            REPO="${{ secrets.DEPLOY_PATH }}"
            cd "${REPO:-/var/www/polymer-intelligence}"
            git fetch origin
            git reset --hard origin/main
            # Prod runs the images tagged `main` (built + pushed by the build-images job).
            export IMAGE_TAG=main
            COMPOSE="docker compose --env-file .env -f deploy/docker-compose.yml"
            # Log in to GHCR (private packages), then PULL — no more compiling on the box.
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            $COMPOSE pull
            $COMPOSE up -d
            # Web App bundle: still a one-shot copy into the nginx-served volume
            # (no --build → nothing compiles on the box). A stale webapp_static
            # serves the previous build; an empty one serves 404 at ai-imex.com.
            $COMPOSE --profile build pull webapp-build
            $COMPOSE --profile build run --rm webapp-build
            # The portal is NOT in that list any more: it is a long-running SSR
            # service, refreshed by the `$COMPOSE pull` + `up -d` above. Running a
            # `portal-build` one-shot here would now fail on an undefined service.
            $COMPOSE restart nginx
            $COMPOSE ps
            docker logout ghcr.io || true

  # ── Deploy to DEV: only on push to dev, and only after CI passes ───────
  # Mirrors the prod `deploy` job but targets the DEV environment on the SAME
  # server: a separate compose project (`-p polymer-dev` → isolated volumes/
  # containers/network), a separate checkout (DEV_DEPLOY_PATH), a separate
  # repo-root .env (dev bot/DB/domains/secrets), and the dev inner-nginx port +
  # config (INNER_NGINX_PORT=8081 + INNER_NGINX_CONF, supplied by that .env).
  # Reuses the prod DEPLOY_* SSH secrets. First bring-up is manual (TLS, dev bot
  # webhook, userbot session) — see docs/runbook-dev-environment.md.
  deploy-dev:
    name: Deploy to dev server
    runs-on: ubuntu-latest
    needs: [backend, dashboard, webapp, portal, build-images]
    if: ${{ github.ref == 'refs/heads/dev' && github.event_name == 'push' }}
    permissions:
      contents: read
      packages: read            # pull the GHCR images published by build-images
    concurrency:
      group: deploy-dev
      cancel-in-progress: false
    steps:
      - name: Pull + redeploy the dev stack on the server over SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          # Ephemeral workflow token (packages: read) + the actor, forwarded so the
          # server can `docker login ghcr.io` and PULL the prebuilt dev images instead
          # of compiling. Token expires with this job — leftover login is inert.
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          passphrase: ${{ secrets.DEPLOY_SSH_PASSPHRASE }}   # for a passphrase-protected key
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          command_timeout: 30m
          envs: GHCR_TOKEN,GHCR_USER
          script: |
            set -eu
            # Dev checkout path on the server (own directory tree, separate from prod).
            # Override with the DEV_DEPLOY_PATH secret if it moves.
            REPO="${{ secrets.DEV_DEPLOY_PATH }}"
            cd "${REPO:-/opt/polymer-dev/polymer-intelligence}"
            git fetch origin
            git reset --hard origin/dev
            # Dev runs the images tagged `dev` (built + pushed by the build-images job).
            export IMAGE_TAG=dev
            # -p polymer-dev isolates the stack from prod; the dev repo-root .env
            # supplies the dev secrets + INNER_NGINX_PORT=8081 + INNER_NGINX_CONF
            # (nginx.dev-server.behind-proxy.conf) for interpolation.
            COMPOSE="docker compose --env-file .env -p polymer-dev -f deploy/docker-compose.yml"
            # Log in to GHCR (private packages), then PULL — no more compiling on the box.
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            $COMPOSE pull
            $COMPOSE up -d
            # Web App bundle: still a one-shot copy into the nginx-served volume
            # (no --build → nothing compiles on the box). A stale webapp_static
            # serves the previous build; an empty one serves 404 at ai-imex.com.
            $COMPOSE --profile build pull webapp-build
            $COMPOSE --profile build run --rm webapp-build
            # The portal is NOT in that list any more: it is a long-running SSR
            # service, refreshed by the `$COMPOSE pull` + `up -d` above. Running a
            # `portal-build` one-shot here would now fail on an undefined service.
            $COMPOSE restart nginx
            $COMPOSE ps
            docker logout ghcr.io || true
