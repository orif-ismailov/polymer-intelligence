# Polymer Intelligence — nginx reverse proxy (BEHIND a TLS-terminating front-door)
# ============================================================================
# Use this config when another reverse proxy on the host (e.g. host nginx,
# Caddy, Traefik, Apache) owns ports 80/443 and terminates HTTPS for the public
# domain, then forwards plain HTTP to THIS stack on an internal port.
#
# This stack therefore: HTTP only, NO TLS, NO certbot, NO 80→443 redirect. The
# front-door is responsible for the public cert (keira.uz) and HSTS. The compose
# nginx publishes this on 127.0.0.1:8080 (see deploy/docker-compose.yml).
#
# Switch back to the self-contained TLS config (nginx.conf) if this stack ever
# owns 80/443 directly.
# ============================================================================

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    # Recover the real client IP from the trusted front-door (host nginx) so the
    # rate-limit + logs key on the visitor, not the proxy. Only the front-door can
    # reach this server (published on 127.0.0.1), and it arrives via the docker
    # bridge gateway — trust the private ranges.
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header   X-Forwarded-For;
    real_ip_recursive on;

    # Login brute-force rate-limit (keyed on the recovered client IP). T-04-06.
    limit_req_zone $binary_remote_addr zone=auth_login:10m rate=10r/m;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log  warn;

    sendfile           on;
    tcp_nopush         on;
    keepalive_timeout  65;
    server_tokens      off;

    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    gzip on;
    gzip_vary on;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml application/wasm;

    # Telegram Web App request file uploads are capped at 10 MB by the API; allow
    # headroom so nginx doesn't 413 before the API can validate (the front-door
    # vhost must set this too).
    client_max_body_size 12m;

    server {
        listen 80;
        # Only the trusted front-door reaches this server (published on 127.0.0.1),
        # which routes by the public host — so accept any Host here.
        server_name _;

        # Non-HSTS security headers (HSTS is set by the TLS-terminating front-door,
        # which is the only layer that sees HTTPS). add_header is non-additive in
        # nested locations, so they are re-declared in the static-asset block (CR-06).
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Content-Security-Policy "frame-ancestors 'none'" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # ── Auth-login rate-limit (must precede the general /api/ block) ────────
        location = /api/v1/auth/login {
            limit_req zone=auth_login burst=5 nodelay;
            limit_req_status 429;
            proxy_pass         http://api:8000;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            # Preserve the original scheme from the front-door (https), defaulting
            # to http if it did not set it.
            proxy_set_header   X-Forwarded-Proto $http_x_forwarded_proto;
            proxy_read_timeout 30s;
        }

        # ── API proxy ──────────────────────────────────────────────────────────
        location /api/ {
            proxy_pass         http://api:8000;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $http_x_forwarded_proto;
            proxy_read_timeout 60s;
            proxy_buffering    off;  # SSE (/feed/stream)
        }

        # ── Dashboard (Next.js) ──────────────────────────────────────────────
        location /dashboard/ {
            proxy_pass         http://dashboard:3000/;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $http_x_forwarded_proto;
        }

        location = / {
            return 301 /dashboard/;
        }

        # ── Static Telegram Web App ──────────────────────────────────────────
        location /webapp/ {
            alias /var/www/webapp/;
            try_files $uri $uri/ /webapp/index.html;
            location ~* \.(js|css|woff2?|png|svg|ico)$ {
                expires 1y;
                add_header Cache-Control "public, immutable";
                add_header X-Content-Type-Options "nosniff" always;
                add_header X-Frame-Options "DENY" always;
                add_header Content-Security-Policy "frame-ancestors 'none'" always;
                add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            }
        }
    }
}
