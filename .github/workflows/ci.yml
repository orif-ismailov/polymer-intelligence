name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "20"

jobs:
  # ── Backend: lint, type-check, and tests ──────────────────────────────────
  backend:
    name: Backend (ruff · mypy · pytest)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: polymer_intelligence_test
          POSTGRES_USER: pi_user
          POSTGRES_PASSWORD: testpassword
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pi_user -d polymer_intelligence_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install dependencies
        run: pip install --upgrade pip && pip install -e ".[dev]"

      # ── Lint: ruff ─────────────────────────────────────────────────────────
      - name: Lint (ruff check)
        run: ruff check .

      # ── Type-check: mypy scoped to services/ and schemas/ ──────────────────
      # Per dev-spec §7: mypy targets backend/app/services + backend/app/schemas
      - name: Type-check (mypy — app/services)
        run: mypy app/services --ignore-missing-imports

      - name: Type-check (mypy — app/schemas)
        run: mypy app/schemas --ignore-missing-imports

      # ── Tests ──────────────────────────────────────────────────────────────
      - name: Run pytest
        env:
          DATABASE_URL: postgresql+psycopg://pi_user:testpassword@localhost:5432/polymer_intelligence_test
          REDIS_URL: redis://localhost:6379/0
          # Required secrets: use placeholder values so Settings doesn't fail-fast
          JWT_SECRET: ci-jwt-secret-placeholder-32chars!!
          BOT_TOKEN: "123456789:AABBCCDDEEFFaabbccddeeff-placeholder"
          WEBHOOK_SECRET: ci-webhook-secret-placeholder
          TG_API_ID: "12345678"
          TG_API_HASH: ci-tg-api-hash-placeholder-32chars!
          ANTHROPIC_API_KEY: sk-ant-ci-placeholder
          S3_ACCESS_KEY: ci-s3-access-key
          S3_SECRET_KEY: ci-s3-secret-key
          S3_BUCKET: ci-bucket
          S3_ENDPOINT_URL: http://localhost:9000
        run: pytest tests/ -q --tb=short

  # ── Dashboard: eslint + tsc ────────────────────────────────────────────────
  dashboard:
    name: Dashboard (eslint · tsc)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: dashboard

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint (eslint)
        run: npx eslint --max-warnings 0

      - name: Type-check (tsc --noEmit)
        run: npx tsc --noEmit

  # ── Webapp: eslint + tsc ───────────────────────────────────────────────────
  webapp:
    name: Webapp (eslint · tsc)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: webapp

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: webapp/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint (eslint)
        run: npx eslint . --ext .ts,.tsx --max-warnings 0

      - name: Type-check (tsc --noEmit)
        run: npx tsc --noEmit

  # ── Container image build (gated on backend + frontend passing) ────────────
  build-images:
    name: Build container images
    runs-on: ubuntu-latest
    needs: [backend, dashboard, webapp]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        run: docker build -f deploy/Dockerfile.backend -t pi-backend:ci backend/

      - name: Build dashboard image
        run: docker build -f deploy/Dockerfile.dashboard -t pi-dashboard:ci dashboard/
