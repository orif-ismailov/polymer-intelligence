# Polymer Intelligence — DEV inner nginx (BEHIND the shared TLS front-door)
# ============================================================================
# Identical in shape to nginx.behind-proxy.conf (prod), but routes the DEV
# hostnames and is published on 127.0.0.1:8081 by the dev-server compose stack.
#
# 3-domain split — routed by the Host header the host front-door forwards:
#   dev-admin.ai-imex.com → dashboard:3000  (Next.js admin panel)
#   dev-api.ai-imex.com   → api:8000        (FastAPI backend + Telegram webhook)
#   dev.ai-imex.com       → portal:3000     (SSR storefront + client cabinet)
# The two frontend domains also proxy /api/ → api:8000 so browser calls stay
# same-origin (no CORS, cookies never cross an origin).
#
# `api` / `dashboard` resolve to the DEV stack's own containers because this
# config runs inside the `polymer-dev` compose project (its own docker network).
#
# HTTP only, NO TLS, NO certbot — the host front-door owns the public certs.
# ============================================================================

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    server_names_hash_bucket_size 64;

    # Recover the real client IP from the trusted front-door (host nginx).
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header   X-Forwarded-For;
    real_ip_recursive on;

    # Login brute-force rate-limit (keyed on the recovered client IP). T-04-06.
    limit_req_zone $binary_remote_addr zone=auth_login:10m rate=10r/m;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log  warn;

    sendfile           on;
    tcp_nopush         on;
    keepalive_timeout  65;
    server_tokens      off;

    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    gzip on;
    gzip_vary on;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml application/wasm;

    client_max_body_size 12m;

    # Security headers, re-declared per server block because nginx `add_header`
    # is non-additive — a block that sets none inherits none.
    #
    # `Strict-Transport-Security` is here rather than on the HOST front door even
    # though that is where TLS actually terminates: the host vhost is a pure
    # proxy with no `add_header` of its own, so all five headers travel together
    # from this file and there is one place to read them. A browser only honours
    # HSTS on an https response, which is exactly what the front door turns these
    # into. Declaring it in both would emit the header twice (IMEX-19).

    # ══════════════════════════════════════════════════════════════════════════
    # dev-api.ai-imex.com — pure FastAPI backend (+ Telegram webhook, direct API)
    # ══════════════════════════════════════════════════════════════════════════
    server {
        listen 80;
        server_name dev-api.ai-imex.com;

        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Content-Security-Policy "frame-ancestors 'none'" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        location = /api/v1/auth/login {
            limit_req zone=auth_login burst=5 nodelay;
            limit_req_status 429;
            proxy_pass         http://api:8000;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $http_x_forwarded_proto;
            proxy_read_timeout 30s;
        }

        # ── Presigned S3 downloads (S3_PUBLIC_ENDPOINT) ───────────────────────
        # MinIO publishes no host ports, so every document link the API handed out
        # named `http://minio:9000` and no client outside the cluster could open
        # one. This is the public door; the presign client signs against this host.
        #
        # The path is the BUCKET name (S3_BUCKET) rather than a tidy `/s3/` prefix,
        # because boto3 signs the full canonical URI: a prefix would be signed in
        # and then stripped here, and the signature would no longer match. Change
        # S3_BUCKET and this location has to change with it.
        #
        # Three details are load-bearing:
        #   * `proxy_pass` with NO trailing slash — the URI must reach MinIO byte
        #     for byte as signed; a trailing slash rewrites the path and breaks it.
        #   * `Host $host` — SigV4 lists `host` in X-Amz-SignedHeaders, so MinIO
        #     recomputes the signature over the host the client sent.
        #   * no auth and no extra headers — the signature IS the authorisation.
        #     The bucket is private (minio-init sets no anonymous policy), so an
        #     unsigned request is a 403 from MinIO and a signed one expires in 600s.
        location /polymer-files/ {
            proxy_pass         http://minio:9000;
            # $http_host, NOT $host: `$host` drops the port, so a public endpoint on
            # a non-default port (http://host:8088) is forwarded as `Host: host` and
            # MinIO answers 403 SignatureDoesNotMatch — the signature covers the host
            # EXACTLY as the client sent it. Verified in a browser; `$host` was here
            # first and produced precisely that 403.
            proxy_set_header   Host $http_host;
            proxy_buffering    off;
            proxy_read_timeout 300s;
        }

        location / {
            proxy_pass         http://api:8000;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $http_x_forwarded_proto;
            proxy_read_timeout 60s;
            proxy_buffering    off;  # SSE (/api/v1/feed/stream)
        }
    }

    # ══════════════════════════════════════════════════════════════════════════
    # dev-admin.ai-imex.com — Next.js dashboard + same-origin /api/ proxy
    # ══════════════════════════════════════════════════════════════════════════
    server {
        listen 80;
        server_name dev-admin.ai-imex.com;

        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Content-Security-Policy "frame-ancestors 'none'" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        location = /api/v1/auth/login {
            limit_req zone=auth_login burst=5 nodelay;
            limit_req_status 429;
            proxy_pass         http://api:8000;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $http_x_forwarded_proto;
            proxy_read_timeout 30s;
        }

        location /api/ {
            proxy_pass         http://api:8000;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $http_x_forwarded_proto;
            proxy_read_timeout 60s;
            proxy_buffering    off;  # SSE live feed
        }

        location / {
            proxy_pass         http://dashboard:3000;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $http_x_forwarded_proto;
        }
    }

    # ══════════════════════════════════════════════════════════════════════════
    # dev.ai-imex.com — the portal (SSR storefront + cabinet), same-origin /api/
    # ══════════════════════════════════════════════════════════════════════════
    # Mirror of the prod `ai-imex.com` block in nginx.behind-proxy.conf.
    # The portal is a long-running Node service now, not a volume: if the portal
    # is down, the symptom is a 502 from this proxy rather than the old 404 from
    # an empty `portal_static`. Check `docker compose ps portal` first.
    server {
        listen 80;
        server_name dev.ai-imex.com;

        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Content-Security-Policy "frame-ancestors 'none'" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        location = /api/v1/auth/login {
            limit_req zone=auth_login burst=5 nodelay;
            limit_req_status 429;
            proxy_pass         http://api:8000;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $http_x_forwarded_proto;
            proxy_read_timeout 30s;
        }

        location /api/ {
            proxy_pass         http://api:8000;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $http_x_forwarded_proto;
            proxy_read_timeout 60s;
            proxy_buffering    off;
        }

        # The portal is server-rendered now, so this is a proxy, not a root.
        # The Node process serves the hashed assets itself and answers every deep
        # link, so the old `try_files … /index.html` rewrite is gone with it.
        location / {
            proxy_pass         http://portal:3000;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $http_x_forwarded_proto;
            proxy_read_timeout 60s;
        }
    }
}
