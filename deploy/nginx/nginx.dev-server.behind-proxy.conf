# Polymer Intelligence — DEV inner nginx (BEHIND the shared TLS front-door)
# ============================================================================
# Identical in shape to nginx.behind-proxy.conf (prod), but routes the DEV
# hostnames and is published on 127.0.0.1:8081 by the dev-server compose stack.
#
# 3-domain split — routed by the Host header the host front-door forwards:
#   dev-admin.ai-imex.com → dashboard:3000  (Next.js admin panel)
#   dev-api.ai-imex.com   → api:8000        (FastAPI backend + Telegram webhook)
#   dev.ai-imex.com       → /var/www/webapp (static Telegram Web App at root)
# The two frontend domains also proxy /api/ → api:8000 so browser calls stay
# same-origin (no CORS, cookies never cross an origin).
#
# `api` / `dashboard` resolve to the DEV stack's own containers because this
# config runs inside the `polymer-dev` compose project (its own docker network).
#
# HTTP only, NO TLS, NO certbot — the host front-door owns the public certs.
# ============================================================================

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    server_names_hash_bucket_size 64;

    # Recover the real client IP from the trusted front-door (host nginx).
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header   X-Forwarded-For;
    real_ip_recursive on;

    # Login brute-force rate-limit (keyed on the recovered client IP). T-04-06.
    limit_req_zone $binary_remote_addr zone=auth_login:10m rate=10r/m;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log  warn;

    sendfile           on;
    tcp_nopush         on;
    keepalive_timeout  65;
    server_tokens      off;

    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    gzip on;
    gzip_vary on;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml application/wasm;

    client_max_body_size 12m;

    # ══════════════════════════════════════════════════════════════════════════
    # dev-api.ai-imex.com — pure FastAPI backend (+ Telegram webhook, direct API)
    # ══════════════════════════════════════════════════════════════════════════
    server {
        listen 80;
        server_name dev-api.ai-imex.com;

        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Content-Security-Policy "frame-ancestors 'none'" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        location = /api/v1/auth/login {
            limit_req zone=auth_login burst=5 nodelay;
            limit_req_status 429;
            proxy_pass         http://api:8000;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $http_x_forwarded_proto;
            proxy_read_timeout 30s;
        }

        location / {
            proxy_pass         http://api:8000;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $http_x_forwarded_proto;
            proxy_read_timeout 60s;
            proxy_buffering    off;  # SSE (/api/v1/feed/stream)
        }
    }

    # ══════════════════════════════════════════════════════════════════════════
    # dev-admin.ai-imex.com — Next.js dashboard + same-origin /api/ proxy
    # ══════════════════════════════════════════════════════════════════════════
    server {
        listen 80;
        server_name dev-admin.ai-imex.com;

        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Content-Security-Policy "frame-ancestors 'none'" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        location = /api/v1/auth/login {
            limit_req zone=auth_login burst=5 nodelay;
            limit_req_status 429;
            proxy_pass         http://api:8000;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $http_x_forwarded_proto;
            proxy_read_timeout 30s;
        }

        location /api/ {
            proxy_pass         http://api:8000;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $http_x_forwarded_proto;
            proxy_read_timeout 60s;
            proxy_buffering    off;  # SSE live feed
        }

        location / {
            proxy_pass         http://dashboard:3000;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $http_x_forwarded_proto;
        }
    }

    # ══════════════════════════════════════════════════════════════════════════
    # dev.ai-imex.com — static Telegram Web App at root + same-origin /api/
    # ══════════════════════════════════════════════════════════════════════════
    server {
        listen 80;
        server_name dev.ai-imex.com;

        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Content-Security-Policy "frame-ancestors 'none'" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        location = /api/v1/auth/login {
            limit_req zone=auth_login burst=5 nodelay;
            limit_req_status 429;
            proxy_pass         http://api:8000;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $http_x_forwarded_proto;
            proxy_read_timeout 30s;
        }

        location /api/ {
            proxy_pass         http://api:8000;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $http_x_forwarded_proto;
            proxy_read_timeout 60s;
            proxy_buffering    off;
        }

        # Static Web App bundle served at the site root (Vite base "/").
        location / {
            root /var/www/webapp;
            try_files $uri $uri/ /index.html;

            location ~* \.(js|css|woff2?|png|svg|ico)$ {
                expires 1y;
                add_header Cache-Control "public, immutable";
                add_header X-Content-Type-Options "nosniff" always;
                add_header X-Frame-Options "DENY" always;
                add_header Content-Security-Policy "frame-ancestors 'none'" always;
                add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            }
        }
    }

    # ══════════════════════════════════════════════════════════════════════════
    # dev-cabinet.ai-imex.com — SSR marketplace + cabinet, same-origin /api/
    # ══════════════════════════════════════════════════════════════════════════
    # Mirror of the prod `cabinet.ai-imex.com` block in nginx.behind-proxy.conf.
    # The portal is a long-running Node service now, not a volume: if the cabinet
    # is down, the symptom is a 502 from this proxy rather than the old 404 from
    # an empty `portal_static`. Check `docker compose ps portal` first.
    server {
        listen 80;
        server_name dev-cabinet.ai-imex.com;

        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Content-Security-Policy "frame-ancestors 'none'" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        location = /api/v1/auth/login {
            limit_req zone=auth_login burst=5 nodelay;
            limit_req_status 429;
            proxy_pass         http://api:8000;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $http_x_forwarded_proto;
            proxy_read_timeout 30s;
        }

        location /api/ {
            proxy_pass         http://api:8000;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $http_x_forwarded_proto;
            proxy_read_timeout 60s;
            proxy_buffering    off;
        }

        # The portal is server-rendered now, so this is a proxy, not a root.
        # The Node process serves the hashed assets itself and answers every deep
        # link, so the old `try_files … /index.html` rewrite is gone with it.
        location / {
            proxy_pass         http://portal:3000;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $http_x_forwarded_proto;
            proxy_read_timeout 60s;
        }
    }
}
