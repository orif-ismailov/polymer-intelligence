name: Deploy

# Auto-deploy on every push to main: SSH into the server, pull the latest code,
# and redeploy the compose stack. Requires three repo secrets (Settings → Secrets
# and variables → Actions): DEPLOY_HOST, DEPLOY_USER, DEPLOY_SSH_KEY (and optional
# DEPLOY_PORT). The .env on the server is untracked, so secrets never leave it.
#
# To deploy ONLY after CI passes instead of on every push, replace the `on:` block
# with the workflow_run form:
#   on:
#     workflow_run:
#       workflows: ["CI"]
#       types: [completed]
#       branches: [main]
# and add to the job:  if: ${{ github.event.workflow_run.conclusion == 'success' }}

on:
  push:
    branches: [main]
  workflow_dispatch: {}   # allow manual "Run workflow" from the Actions tab

concurrency:
  group: deploy-main
  cancel-in-progress: false   # never interrupt an in-progress deploy

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Pull + redeploy on the server over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          passphrase: ${{ secrets.DEPLOY_SSH_PASSPHRASE }}   # for a passphrase-protected key
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          command_timeout: 30m
          script: |
            set -euo pipefail
            cd /var/www/polymer
            git fetch origin
            git reset --hard origin/main
            COMPOSE="docker compose --env-file .env -f deploy/docker-compose.yml"
            # --build only recreates a container if its image actually rebuilt; on a
            # build failure the running (old) stack is left untouched, so a broken
            # push can't take the live site down at this step.
            $COMPOSE up -d --build
            $COMPOSE --profile build run --rm --build webapp-build
            # api may have been recreated (new docker IP) — re-resolve it in nginx.
            $COMPOSE restart nginx
            $COMPOSE ps
