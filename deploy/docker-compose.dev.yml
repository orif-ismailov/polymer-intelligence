# Polymer Intelligence — Development stack
# ============================================================================
# Usage:
#   docker compose -f deploy/docker-compose.dev.yml up
#
# Prerequisites:
#   - Copy deploy/.env.example → .env (repo root) and fill in secrets
#   - Or set the env_file path below to wherever your .env lives
#
# Services: postgres, redis, api, worker, beat, nginx
# (userbot and dashboard are separate and not included in the dev scaffold)
# ============================================================================

services:

  # ── PostgreSQL 16 ──────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file:
      - path: ../.env
        required: false   # .env lives outside the repo; not present in CI/scaffold validation
    environment:
      # Override with safe dev defaults if .env does not set these
      POSTGRES_DB: polymer_intelligence
      POSTGRES_USER: pi_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-devpassword}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pi_user -d polymer_intelligence"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis ──────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── MinIO (S3-compatible object storage for request file uploads) ─────────
  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minioadmin}
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/minio/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── API (FastAPI + uvicorn) ────────────────────────────────────────────────
  api:
    build:
      context: ../backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - path: ../.env
        required: false   # .env lives outside the repo; not present in CI/scaffold validation
    environment:
      DATABASE_URL: postgresql+psycopg://pi_user:${POSTGRES_PASSWORD:-devpassword}@postgres:5432/polymer_intelligence
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT: http://minio:9000
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    # Apply the locked schema AND seed reference + staff data BEFORE serving
    # (SC#2 — fresh `docker compose up` migrates and seeds a clean DB, no manual
    # step). All three steps are idempotent. They run as pre-start steps (the
    # advisory-locked app.entrypoint runner + the ON CONFLICT seeders) rather than
    # the in-app lifespan: under `--reload` with the bind-mounted source, alembic
    # writing bytecode into /app makes the watcher restart uvicorn mid-migration.
    # The lifespan hook (RUN_MIGRATIONS_ON_STARTUP, default false) stays available
    # for prod/no-reload.
    command: sh -c "python -m app.entrypoint && python -m app.seed.seed_reference && python -m app.seed.seed_staff && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    volumes:
      - ../backend:/app  # live reload in dev
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/api/v1/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ── Celery Worker ─────────────────────────────────────────────────────────
  worker:
    build:
      context: ../backend
      dockerfile: Dockerfile
    # REQ-nfr-reliability / T-02-25: auto-restarts on crash so a single worker
    # failure never silently stops ingest. The */5 check_source_health task +
    # 3-strike source_failure alert surface any persistent outage above this.
    restart: unless-stopped
    env_file:
      - path: ../.env
        required: false   # .env lives outside the repo
    environment:
      DATABASE_URL: postgresql+psycopg://pi_user:${POSTGRES_PASSWORD:-devpassword}@postgres:5432/polymer_intelligence
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT: http://minio:9000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: celery -A app.tasks.celery_app worker --loglevel=info -Q ingest,parse,notify,default
    volumes:
      - ../backend:/app

  # ── Celery Beat (scheduler) ───────────────────────────────────────────────
  beat:
    build:
      context: ../backend
      dockerfile: Dockerfile
    # REQ-nfr-reliability / T-02-25: auto-restarts on crash so the beat
    # scheduler never silently drops its periodic fetch/health schedule.
    restart: unless-stopped
    env_file:
      - path: ../.env
        required: false   # .env lives outside the repo
    environment:
      DATABASE_URL: postgresql+psycopg://pi_user:${POSTGRES_PASSWORD:-devpassword}@postgres:5432/polymer_intelligence
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: celery -A app.tasks.celery_app beat --loglevel=info
    volumes:
      - ../backend:/app

  # ── nginx reverse proxy ────────────────────────────────────────────────────
  # Mounts the HTTP-only dev config (deploy/nginx/nginx.dev.conf).
  # TLS (443/ssl), letsencrypt certs, and the dashboard upstream are prod-only
  # and live in deploy/nginx/nginx.conf — not used here. Only port 80 is
  # published in dev since the dev config has no TLS server block.
  nginx:
    image: nginx:stable
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.dev.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api

volumes:
  postgres_data:
  redis_data:
  minio_data:
