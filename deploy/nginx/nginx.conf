# Polymer Intelligence — nginx reverse proxy
# TLS-ready: certbot cert paths referenced; plain HTTP → HTTPS redirect stub.
# Serves the built static webapp, proxies /api to the api container.
# Rate-limits /api/v1/auth/login against brute-force / credential-stuffing
# (ASVS L1 V2.2.1 — T-04-06, closing the gap for plan 01-03's login endpoint).

worker_processes auto;

# ── Worker connections ────────────────────────────────────────────────────────
# Mandatory top-level block; nginx refuses to start without it (CR-01).
events {
    worker_connections 1024;
}

# ── Rate-limit zone ──────────────────────────────────────────────────────────
# Keyed on client IP; 10m = ~160,000 IP state entries.
# rate=10r/m: up to ~10 login attempts per minute per client IP.
http {

    limit_req_zone $binary_remote_addr zone=auth_login:10m rate=10r/m;

    # ── Logging ─────────────────────────────────────────────────────────────
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log  warn;

    sendfile           on;
    tcp_nopush         on;
    keepalive_timeout  65;
    server_tokens      off;  # do not expose nginx version

    # ── MIME types ──────────────────────────────────────────────────────────
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ── Gzip ────────────────────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml application/wasm;

    # ── HTTP → HTTPS redirect ────────────────────────────────────────────────
    server {
        listen 80;
        server_name _;

        # ACME challenge (certbot webroot)
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ── HTTPS main server ────────────────────────────────────────────────────
    server {
        listen 443 ssl;
        http2 on;
        server_name _;  # Replace with actual domain in production

        # TLS certificates (managed by certbot / Let's Encrypt)
        ssl_certificate     /etc/letsencrypt/live/example.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;

        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256;
        ssl_prefer_server_ciphers off;

        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 10m;

        # ── Security headers (T-04-01, T-04-03) ─────────────────────────────
        # Prevent MIME-type sniffing (ASVS L1 V7.1.2)
        add_header X-Content-Type-Options "nosniff" always;
        # Clickjacking protection (ASVS L1 V14.4.4)
        add_header X-Frame-Options "DENY" always;
        add_header Content-Security-Policy "frame-ancestors 'none'" always;
        # HSTS — force HTTPS for future requests (ASVS L1 V9.1.1)
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        # Referrer policy
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # ── Auth-login rate-limit (T-04-06, ASVS L1 V2.2.1) ─────────────────
        # More specific location = /api/v1/auth/login must appear BEFORE
        # the general /api/ location block so nginx matches it first.
        location = /api/v1/auth/login {
            # burst=5 nodelay: allow a short burst but immediately queue/reject beyond limit
            limit_req zone=auth_login burst=5 nodelay;
            # Return HTTP 429 Too Many Requests when limit is exceeded
            limit_req_status 429;

            proxy_pass         http://api:8000;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 30s;
        }

        # ── General API proxy (T-04-05: only /api/ exposed, not internal services) ──
        location /api/ {
            proxy_pass         http://api:8000;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 60s;
            proxy_buffering    off;  # Required for SSE (/feed/stream)
        }

        # ── Dashboard (Next.js) ──────────────────────────────────────────────
        location /dashboard/ {
            proxy_pass         http://dashboard:3000/;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        # Root → dashboard
        location = / {
            return 301 /dashboard/;
        }

        # ── Static Telegram Web App ──────────────────────────────────────────
        # Built static files served directly by nginx (no separate container)
        location /webapp/ {
            alias /var/www/webapp/;
            try_files $uri $uri/ /webapp/index.html;
            # Long-term cache for hashed assets; no-cache for index.html
            # CR-06 fix (T-04-03): nginx add_header is non-additive — any add_header in a
            # nested location discards inherited server-level headers. Re-declare all five
            # security headers here so they are not dropped on hashed static-asset responses.
            location ~* \.(js|css|woff2?|png|svg|ico)$ {
                expires 1y;
                add_header Cache-Control "public, immutable";
                add_header X-Content-Type-Options "nosniff" always;
                add_header X-Frame-Options "DENY" always;
                add_header Content-Security-Policy "frame-ancestors 'none'" always;
                add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
                add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            }
        }

        # ── Certbot webroot (used during cert renewal) ───────────────────────
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }
    }
}
