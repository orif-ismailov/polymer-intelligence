# Polymer Intelligence — nginx reverse proxy (BEHIND a TLS-terminating front-door)
# ============================================================================
# Use this config when a shared reverse proxy on the host (host nginx / Caddy /
# Traefik) owns ports 80/443, terminates HTTPS for the public domains, and
# forwards plain HTTP to THIS stack on an internal port (127.0.0.1:8080).
#
# 3-domain split — routed by the Host header the front-door forwards:
#   admin.ai-imex.com → dashboard:3000  (Next.js admin panel)
#   api.ai-imex.com   → api:8000        (FastAPI backend + Telegram webhook)
#   ai-imex.com (+www)→ /var/www/webapp (static Telegram Web App at root)
# The two frontend domains also proxy /api/ → api:8000 so browser calls stay
# same-origin (no CORS, cookies never cross an origin).
#
# HTTP only, NO TLS, NO certbot, NO 80→443 redirect — the front-door owns the
# public certs + HSTS. Switch to the self-contained TLS config (nginx.conf) only
# if this stack ever owns 80/443 directly.
# ============================================================================

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    # Long vhost names (admin./api./www.ai-imex.com) overflow the default 32-byte
    # server-name hash bucket on some nginx builds — raise it so nginx can start.
    server_names_hash_bucket_size 64;

    # Recover the real client IP from the trusted front-door (host nginx) so the
    # rate-limit + logs key on the visitor, not the proxy. Only the front-door can
    # reach this server (published on 127.0.0.1), and it arrives via the docker
    # bridge gateway — trust the private ranges.
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header   X-Forwarded-For;
    real_ip_recursive on;

    # Login brute-force rate-limit (keyed on the recovered client IP). T-04-06.
    limit_req_zone $binary_remote_addr zone=auth_login:10m rate=10r/m;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log  warn;

    sendfile           on;
    tcp_nopush         on;
    keepalive_timeout  65;
    server_tokens      off;

    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    gzip on;
    gzip_vary on;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml application/wasm;

    # Telegram Web App request file uploads are capped at 10 MB by the API; allow
    # headroom so nginx doesn't 413 before the API can validate (the front-door
    # vhost must set this too).
    client_max_body_size 12m;

    # Security headers, re-declared per server block because nginx `add_header`
    # is non-additive — a block that sets none inherits none.
    #
    # `Strict-Transport-Security` is here rather than on the HOST front door even
    # though that is where TLS actually terminates: the host vhost is a pure
    # proxy with no `add_header` of its own, so all five headers travel together
    # from this file and there is one place to read them. A browser only honours
    # HSTS on an https response, which is exactly what the front door turns these
    # into. Declaring it in both would emit the header twice (IMEX-19).

    # Non-HSTS security headers (HSTS is set by the TLS-terminating front-door,
    # which is the only layer that sees HTTPS). Re-declared per static-asset block
    # below because add_header is non-additive in nested locations (CR-06).

    # ══════════════════════════════════════════════════════════════════════════
    # api.ai-imex.com — pure FastAPI backend (+ Telegram webhook, direct API)
    # ══════════════════════════════════════════════════════════════════════════
    server {
        listen 80;
        server_name api.ai-imex.com;

        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Content-Security-Policy "frame-ancestors 'none'" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        location = /api/v1/auth/login {
            limit_req zone=auth_login burst=5 nodelay;
            limit_req_status 429;
            proxy_pass         http://api:8000;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $http_x_forwarded_proto;
            proxy_read_timeout 30s;
        }

        # ── Presigned S3 downloads (S3_PUBLIC_ENDPOINT) ───────────────────────
        # MinIO publishes no host ports, so every document link the API handed out
        # named `http://minio:9000` and no client outside the cluster could open
        # one. This is the public door; the presign client signs against this host.
        #
        # The path is the BUCKET name (S3_BUCKET) rather than a tidy `/s3/` prefix,
        # because boto3 signs the full canonical URI: a prefix would be signed in
        # and then stripped here, and the signature would no longer match. Change
        # S3_BUCKET and this location has to change with it.
        #
        # Three details are load-bearing:
        #   * `proxy_pass` with NO trailing slash — the URI must reach MinIO byte
        #     for byte as signed; a trailing slash rewrites the path and breaks it.
        #   * `Host $host` — SigV4 lists `host` in X-Amz-SignedHeaders, so MinIO
        #     recomputes the signature over the host the client sent.
        #   * no auth and no extra headers — the signature IS the authorisation.
        #     The bucket is private (minio-init sets no anonymous policy), so an
        #     unsigned request is a 403 from MinIO and a signed one expires in 600s.
        location /polymer-files/ {
            proxy_pass         http://minio:9000;
            # $http_host, NOT $host: `$host` drops the port, so a public endpoint on
            # a non-default port (http://host:8088) is forwarded as `Host: host` and
            # MinIO answers 403 SignatureDoesNotMatch — the signature covers the host
            # EXACTLY as the client sent it. Verified in a browser; `$host` was here
            # first and produced precisely that 403.
            proxy_set_header   Host $http_host;
            proxy_buffering    off;
            proxy_read_timeout 300s;
        }

        location / {
            proxy_pass         http://api:8000;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $http_x_forwarded_proto;
            proxy_read_timeout 60s;
            proxy_buffering    off;  # SSE (/api/v1/feed/stream)
        }
    }

    # ══════════════════════════════════════════════════════════════════════════
    # admin.ai-imex.com — Next.js dashboard + same-origin /api/ proxy
    # ══════════════════════════════════════════════════════════════════════════
    server {
        listen 80;
        server_name admin.ai-imex.com;

        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Content-Security-Policy "frame-ancestors 'none'" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        location = /api/v1/auth/login {
            limit_req zone=auth_login burst=5 nodelay;
            limit_req_status 429;
            proxy_pass         http://api:8000;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $http_x_forwarded_proto;
            proxy_read_timeout 30s;
        }

        location /api/ {
            proxy_pass         http://api:8000;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $http_x_forwarded_proto;
            proxy_read_timeout 60s;
            proxy_buffering    off;  # SSE live feed
        }

        location / {
            proxy_pass         http://dashboard:3000;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $http_x_forwarded_proto;
        }
    }

    # ══════════════════════════════════════════════════════════════════════════
    # ai-imex.com (+ www) — static Telegram Web App at root + same-origin /api/
    # ══════════════════════════════════════════════════════════════════════════
    server {
        listen 80;
        server_name ai-imex.com www.ai-imex.com;

        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Content-Security-Policy "frame-ancestors 'none'" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        location = /api/v1/auth/login {
            limit_req zone=auth_login burst=5 nodelay;
            limit_req_status 429;
            proxy_pass         http://api:8000;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $http_x_forwarded_proto;
            proxy_read_timeout 30s;
        }

        location /api/ {
            proxy_pass         http://api:8000;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $http_x_forwarded_proto;
            proxy_read_timeout 60s;
            proxy_buffering    off;
        }

        # Static Web App bundle served at the site root (Vite base "/").
        location / {
            root /var/www/webapp;
            try_files $uri $uri/ /index.html;

            location ~* \.(js|css|woff2?|png|svg|ico)$ {
                expires 1y;
                add_header Cache-Control "public, immutable";
                add_header X-Content-Type-Options "nosniff" always;
                add_header X-Frame-Options "DENY" always;
                add_header Content-Security-Policy "frame-ancestors 'none'" always;
                add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
                add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            }
        }
    }

    # ══════════════════════════════════════════════════════════════════════════
    # cabinet.ai-imex.com — SSR marketplace + cabinet at root, same-origin /api/
    # ══════════════════════════════════════════════════════════════════════════
    server {
        listen 80;
        server_name cabinet.ai-imex.com;

        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Content-Security-Policy "frame-ancestors 'none'" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        location /api/ {
            proxy_pass         http://api:8000;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $http_x_forwarded_proto;
            proxy_read_timeout 60s;
            proxy_buffering    off;
        }

        # The portal is server-rendered now, so this is a proxy, not a root.
        # The Node process serves the hashed assets itself (sirv, immutable
        # caching) and renders the public marketplace routes to HTML. Serving
        # files from a volume here would bypass the renderer and hand a crawler
        # the empty shell, which is the whole thing this change exists to fix.
        location / {
            proxy_pass         http://portal:3000;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $http_x_forwarded_proto;
            proxy_read_timeout 60s;
        }
    }
}
